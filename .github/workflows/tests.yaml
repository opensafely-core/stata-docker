name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  IMAGE_NAME: stata-mp
  STATA_LICENSE: ${{ secrets.STATA_LICENSE }}
permissions:
  contents: read

jobs:

  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opensafely-core/setup-action@1f93a08c6e31a75b0908fcac5d25c2cf729c31f2 # v1.8.0
        with:
          install-just: true
          install-uv: true

      - name: Check
        run: just check

  tests:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opensafely-core/setup-action@1f93a08c6e31a75b0908fcac5d25c2cf729c31f2 # v1.8.0
        with:
          install-just: true
          install-uv: true

      - name: Build image
        run: just build

      - name: Run tests
        run: just test
