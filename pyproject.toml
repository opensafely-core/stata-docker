[project]
name = "stata-docker"
version = "0.0.1"
requires-python = ">=3.11,<3.12"

[tool.black]
extend-exclude = 'bin/'

[tool.ruff]
line-length = 88
exclude = [
  ".direnv",
  ".git",
  ".github",
  ".venv",
  "__pycache__",
  "bin/",
  "coverage",
  "deploy",
  "venv",
]
extend-select = [
  "I",  # isort
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "UP",  # pyupgrade
  "W",  # pycodestyle warning
]
extend-ignore = [
  "E501",
  "E731",
]

[tool.uv]
required-version = ">=0.13"
